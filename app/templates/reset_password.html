<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - BookNimbus</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .container {
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      padding: 45px 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo h1 {
      font-size: 36px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .logo p {
      font-size: 16px;
      color: #666;
    }

    .error-message {
      background: rgba(255, 71, 87, 0.1);
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: #ff4757;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 22px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      color: #333;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
      font-size: 15px;
      transition: all 0.3s;
      background: #f8f9fa;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .password-requirements {
      font-size: 13px;
      color: #666;
      margin-top: -14px;
      margin-bottom: 20px;
      padding-left: 4px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      position: relative;
      overflow: hidden;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .loader {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    button.loading .btn-text { display: none; }
    button.loading .loader { display: block; }

    .message {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      display: none;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.success {
      background: rgba(46, 213, 115, 0.15);
      border: 1px solid rgba(46, 213, 115, 0.3);
      color: #27ae60;
    }

    .message.error {
      background: rgba(255, 71, 87, 0.15);
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: #ff4757;
    }

    .back-link {
      text-align: center;
      margin-top: 25px;
    }

    .back-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: color 0.3s;
    }

    .back-link a:hover {
      color: #764ba2;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>🔒 Reset Password</h1>
      <p>Enter your new password</p>
    </div>

    {% if not valid_token %}
      <div class="error-message">
        {{ message }}
      </div>
      <div class="back-link">
        <a href="/">← Back to Login</a>
      </div>
    {% else %}
      <form id="reset-form">
        <input type="hidden" id="token" value="{{ token }}">

        <div class="input-group">
          <label>New Password</label>
          <input type="password" name="password" id="password" placeholder="Enter new password" required minlength="6">
        </div>

        <div class="password-requirements">
          Must be at least 6 characters long
        </div>

        <div class="input-group">
          <label>Confirm Password</label>
          <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm new password" required minlength="6">
        </div>

        <button type="submit">
          <span class="btn-text">Reset Password</span>
          <div class="loader"></div>
        </button>

        <div class="message" id="message"></div>
      </form>

      <div class="back-link">
        <a href="/">← Back to Login</a>
      </div>
    {% endif %}
  </div>

  <script>
    const form = document.getElementById('reset-form');

    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const btn = form.querySelector('button');
        const msgEl = document.getElementById('message');
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        const token = document.getElementById('token').value;

        // Clear previous messages
        msgEl.style.display = 'none';

        // Validate passwords match
        if (password !== confirmPassword) {
          msgEl.textContent = 'Passwords do not match!';
          msgEl.className = 'message error';
          msgEl.style.display = 'block';
          return;
        }

        // Show loading
        btn.classList.add('loading');
        btn.disabled = true;

        try {
          const res = await fetch('/reset-password/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              token: token,
              password: password,
              confirm_password: confirmPassword
            })
          });

          const data = await res.json();

          if (data.status === 'success') {
            msgEl.textContent = data.message;
            msgEl.className = 'message success';
            msgEl.style.display = 'block';
            form.reset();

            // Redirect to login after 2 seconds
            setTimeout(() => {
              window.location.href = '/';
            }, 2000);
          } else {
            msgEl.textContent = data.message;
            msgEl.className = 'message error';
            msgEl.style.display = 'block';
          }
        } catch (err) {
          msgEl.textContent = 'Connection error. Please try again.';
          msgEl.className = 'message error';
          msgEl.style.display = 'block';
          console.error(err);
        } finally {
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
