<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - BookNimbus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .post-type-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 10px;
        }

        .post-type-option {
            flex: 1;
            text-align: center;
            padding: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .post-type-option.active {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .post-type-option h3 {
            margin-bottom: 0.5rem;
            color: #333;
        }

        .post-type-option p {
            color: #666;
            font-size: 0.9rem;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .file-input {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 12px 16px;
            background: #f8f9fa;
            border: 2px dashed #e0e0e0;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #666;
        }

        .file-input-label:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .file-name {
            margin-top: 5px;
            font-size: 12px;
            color: #666;
        }

        .preview {
            margin-top: 10px;
            text-align: center;
        }

        .cover-preview {
            max-width: 150px;
            max-height: 200px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-btn {
            width: 100%;
            padding: 12px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            color: #667eea;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .back-btn:hover {
            background: #f0f4ff;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        button.loading .btn-text { display: none; }
        button.loading .loader { display: block; }

        .message {
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.success {
            background: rgba(46, 213, 115, 0.15);
            border: 1px solid rgba(46, 213, 115, 0.3);
            color: #27ae60;
        }

        .message.error {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff4757;
        }

        .requirements {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        /* Add this to ensure hidden form sections don't interfere */
        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📖 Create New Content</h1>
            <p>Share your book or write a blog post</p>
        </div>

        <!-- Post Type Selector -->
        <div class="post-type-selector">
            <div class="post-type-option active" data-type="book">
                <h3>📚 Publish Book</h3>
                <p>Upload a new book with EPUB file</p>
            </div>
            <div class="post-type-option" data-type="blog">
                <h3>📝 Write Blog Post</h3>
                <p>Share your thoughts and ideas</p>
            </div>
        </div>

        <form id="post-form" enctype="multipart/form-data">
            <input type="hidden" id="post_type" name="post_type" value="book">

            <!-- Book Form Section -->
            <div class="form-section active" id="book-form">
                <div class="form-group">
                    <label for="book_title">Book Title *</label>
                    <input type="text" id="book_title" name="book_title" placeholder="Enter book title" required>
                </div>

                <div class="form-group">
                    <label for="author">Author Name *</label>
                    <input type="text" id="author" name="author" placeholder="Enter author name" value="{{ username }}" required>
                </div>

                <div class="form-group">
                    <label for="genre">Genre *</label>
                    <select id="genre" name="genre" required>
                        <option value="">Select a genre</option>
                        <option value="Fiction">Fiction</option>
                        <option value="Non-Fiction">Non-Fiction</option>
                        <option value="Mystery">Mystery</option>
                        <option value="Romance">Romance</option>
                        <option value="Science Fiction">Science Fiction</option>
                        <option value="Fantasy">Fantasy</option>
                        <option value="Thriller">Thriller</option>
                        <option value="Biography">Biography</option>
                        <option value="Self-Help">Self-Help</option>
                        <option value="History">History</option>
                        <option value="Poetry">Poetry</option>
                        <option value="Drama">Drama</option>
                        <option value="Horror">Horror</option>
                        <option value="Adventure">Adventure</option>
                        <option value="Children">Children</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="year">Publication Year *</label>
                    <input type="number" id="year" name="year" min="1900" max="2025" value="2024" required>
                </div>

                <div class="form-group">
                    <label for="cover">Book Cover *</label>
                    <div class="file-input">
                        <input type="file" id="cover" name="cover" accept="image/*" required>
                        <label for="cover" class="file-input-label">
                            📷 Click to upload cover image
                        </label>
                    </div>
                    <div class="requirements">JPEG, PNG, or WebP (Max 5MB)</div>
                    <div class="preview" id="cover-preview"></div>
                </div>

                <div class="form-group">
                    <label for="epub">EPUB File *</label>
                    <div class="file-input">
                        <input type="file" id="epub" name="epub" accept=".epub" required>
                        <label for="epub" class="file-input-label">
                            📚 Click to upload EPUB file
                        </label>
                    </div>
                    <div class="requirements">EPUB format only (Max 50MB)</div>
                    <div class="file-name" id="epub-name"></div>
                </div>
            </div>

            <!-- Blog Form Section -->
            <div class="form-section" id="blog-form">
                <div class="form-group">
                    <label for="blog_title">Post Title *</label>
                    <input type="text" id="blog_title" name="blog_title" placeholder="Enter post title">
                </div>

                <div class="form-group">
                    <label for="content">Post Content *</label>
                    <textarea id="content" name="content" placeholder="Write your blog post here..." rows="10"></textarea>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">
                <span class="btn-text" id="btn-text">Publish Book</span>
                <div class="loader"></div>
            </button>

            <button type="button" class="back-btn" onclick="goBack()">
                ← Back to Shelves
            </button>

            <div class="message" id="message"></div>
        </form>
    </div>

    <script>
        // Post type selection
        document.querySelectorAll('.post-type-option').forEach(option => {
            option.addEventListener('click', function() {
                const type = this.getAttribute('data-type');

                // Update active states
                document.querySelectorAll('.post-type-option').forEach(opt => {
                    opt.classList.remove('active');
                });
                this.classList.add('active');

                // Update form sections
                document.querySelectorAll('.form-section').forEach(section => {
                    section.classList.remove('active');
                });
                document.getElementById(type + '-form').classList.add('active');

                // Update hidden field and button text
                document.getElementById('post_type').value = type;
                document.getElementById('btn-text').textContent =
                    type === 'book' ? 'Publish Book' : 'Publish Post';

                // Handle required attributes - clear them properly
                if (type === 'book') {
                    // Enable book fields
                    document.getElementById('book_title').required = true;
                    document.getElementById('author').required = true;
                    document.getElementById('genre').required = true;
                    document.getElementById('year').required = true;
                    document.getElementById('cover').required = true;
                    document.getElementById('epub').required = true;

                    // Disable blog fields
                    document.getElementById('blog_title').required = false;
                    document.getElementById('content').required = false;

                    // Clear blog fields to prevent interference
                    document.getElementById('blog_title').value = '';
                    document.getElementById('content').value = '';
                } else {
                    // Enable blog fields
                    document.getElementById('blog_title').required = true;
                    document.getElementById('content').required = true;

                    // Disable book fields
                    document.getElementById('book_title').required = false;
                    document.getElementById('author').required = false;
                    document.getElementById('genre').required = false;
                    document.getElementById('year').required = false;
                    document.getElementById('cover').required = false;
                    document.getElementById('epub').required = false;

                    // Clear book fields to prevent interference
                    document.getElementById('book_title').value = '';
                    document.getElementById('author').value = '{{ username }}';
                    document.getElementById('genre').value = '';
                    document.getElementById('year').value = '2024';
                    document.getElementById('cover').value = '';
                    document.getElementById('epub').value = '';
                    document.getElementById('cover-preview').innerHTML = '';
                    document.getElementById('epub-name').textContent = '';
                }
            });
        });

        // File input handlers
        document.getElementById('cover').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const preview = document.getElementById('cover-preview');

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `<img src="${e.target.result}" alt="Cover preview" class="cover-preview">`;
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('epub').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const fileName = document.getElementById('epub-name');

            if (file) {
                fileName.textContent = `Selected: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
            }
        });

        // Form submission
        document.getElementById('post-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            const messageEl = document.getElementById('message');

            // Show loading
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
            messageEl.style.display = 'none';

            try {
                const formData = new FormData(this);
                const postType = document.getElementById('post_type').value;

                // Debug: Log form data
                console.log('Form data entries:');
                for (let [key, value] of formData.entries()) {
                    console.log(key + ': ' + value);
                }

                const response = await fetch('/create-post/', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': getCSRFToken()
                    }
                });

                const data = await response.json();

                if (data.status === 'success') {
                    messageEl.textContent = data.message;
                    messageEl.className = 'message success';
                    messageEl.style.display = 'block';

                    // Redirect to shelves after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/shelves/';
                    }, 2000);
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                messageEl.textContent = error.message || 'Error creating post. Please try again.';
                messageEl.className = 'message error';
                messageEl.style.display = 'block';
                console.error('Submission error:', error);
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });

        // Get CSRF token
        function getCSRFToken() {
            const name = 'csrftoken';
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function goBack() {
            window.location.href = '/shelves/';
        }

        // Initialize form on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Set initial author name
            document.getElementById('author').value = '{{ username }}';
        });
    </script>
</body>
</html>
