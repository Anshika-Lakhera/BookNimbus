<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNimbus - Authentication</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0e27;
      overflow-x: hidden;
      position: relative;
    }

    .background {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3), transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(142, 45, 226, 0.3), transparent 50%),
                  radial-gradient(circle at 40% 20%, rgba(75, 108, 183, 0.2), transparent 50%);
      animation: rotateBG 30s linear infinite;
      z-index: 0;
    }

    @keyframes rotateBG {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .container {
      position: relative;
      width: 440px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 45px 40px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6),
                  inset 0 1px 1px rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      z-index: 1;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo h1 {
      font-size: 38px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 20px rgba(102, 126, 234, 0.3);
      margin-bottom: 8px;
    }

    .logo p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 300;
    }

    .tabs {
      display: flex;
      position: relative;
      margin-bottom: 30px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 4px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      cursor: pointer;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.5);
      transition: all 0.3s;
      position: relative;
      z-index: 2;
      border-radius: 8px;
      font-size: 15px;
    }

    .tab.active {
      color: #fff;
      background: rgba(102, 126, 234, 0.2);
    }

    form {
      display: none;
      flex-direction: column;
      animation: slideIn 0.3s ease-out;
    }

    form.active { display: flex; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 15px;
      transition: all 0.3s;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .forgot-link {
      text-align: right;
      font-size: 13px;
      color: #667eea;
      cursor: pointer;
      margin-bottom: 20px;
      transition: color 0.3s;
    }

    .forgot-link:hover {
      color: #8b9aff;
      text-decoration: underline;
    }

    button {
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      position: relative;
      overflow: hidden;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .loader {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    button.loading .btn-text { display: none; }
    button.loading .loader { display: block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .message {
      margin-top: 15px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.success {
      background: rgba(46, 213, 115, 0.15);
      border: 1px solid rgba(46, 213, 115, 0.3);
      color: #2ed573;
    }

    .message.error {
      background: rgba(255, 71, 87, 0.15);
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: #ff4757;
    }

    .password-strength {
      margin-top: -12px;
      margin-bottom: 20px;
    }

    .strength-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .strength-fill {
      height: 100%;
      width: 0%;
      transition: all 0.3s;
      border-radius: 2px;
    }

    .strength-text {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    @media (max-width: 500px) {
      .container {
        width: 90%;
        padding: 35px 25px;
      }
    }
  </style>
</head>
<body>
  <div class="background"></div>

  <div class="container">
    <div class="logo">
      <h1>📚 BookNimbus</h1>
      <p>Your Personal Library in the Cloud</p>
    </div>

    <div class="tabs">
      <div class="tab active" id="login-tab">Login</div>
      <div class="tab" id="signup-tab">Sign Up</div>
      <div class="tab" id="forgot-tab">Reset</div>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="active">
      <div class="input-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>
      </div>
      <div class="forgot-link" id="forgot-link">Forgot password?</div>
      <button type="submit">
        <span class="btn-text">Login</span>
        <div class="loader"></div>
      </button>
      <div class="message" id="login-message"></div>
    </form>

    <!-- Sign Up Form -->
    <form id="signup-form">
      <div class="input-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Choose a username" required minlength="3">
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="your.email@example.com" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" id="signup-password" placeholder="Create a password" required minlength="6">
      </div>
      <div class="password-strength" id="password-strength" style="display: none;">
        <div class="strength-bar">
          <div class="strength-fill" id="strength-fill"></div>
        </div>
        <div class="strength-text" id="strength-text"></div>
      </div>
      <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" placeholder="Confirm your password" required minlength="6">
      </div>
      <button type="submit">
        <span class="btn-text">Create Account</span>
        <div class="loader"></div>
      </button>
      <div class="message" id="signup-message"></div>
    </form>

    <!-- Forgot Password Form -->
    <form id="forgot-form">
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="Enter your registered email" required>
      </div>
      <button type="submit">
        <span class="btn-text">Send Reset Link</span>
        <div class="loader"></div>
      </button>
      <div class="message" id="forgot-message"></div>
    </form>
  </div>

  <script>
    const loginTab = document.getElementById('login-tab');
    const signupTab = document.getElementById('signup-tab');
    const forgotTab = document.getElementById('forgot-tab');
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');
    const forgotForm = document.getElementById('forgot-form');
    const forgotLink = document.getElementById('forgot-link');
    const signupPassword = document.getElementById('signup-password');
    const passwordStrength = document.getElementById('password-strength');

    // Tab switching
    function switchTab(activeTab, activeForm) {
      [loginTab, signupTab, forgotTab].forEach(t => t.classList.remove('active'));
      [loginForm, signupForm, forgotForm].forEach(f => f.classList.remove('active'));
      activeTab.classList.add('active');
      activeForm.classList.add('active');
      clearMessages();
    }

    loginTab.addEventListener('click', () => switchTab(loginTab, loginForm));
    signupTab.addEventListener('click', () => switchTab(signupTab, signupForm));
    forgotTab.addEventListener('click', () => switchTab(forgotTab, forgotForm));
    forgotLink.addEventListener('click', () => switchTab(forgotTab, forgotForm));

    // Password strength checker
    signupPassword.addEventListener('input', (e) => {
      const pw = e.target.value;
      if (pw.length === 0) {
        passwordStrength.style.display = 'none';
        return;
      }
      passwordStrength.style.display = 'block';

      let strength = 0;
      if (pw.length >= 8) strength++;
      if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) strength++;
      if (/\d/.test(pw)) strength++;
      if (/[^a-zA-Z0-9]/.test(pw)) strength++;

      const fill = document.getElementById('strength-fill');
      const text = document.getElementById('strength-text');

      if (strength <= 1) {
        fill.style.width = '25%';
        fill.style.background = '#ff4757';
        text.textContent = 'Weak password';
        text.style.color = '#ff4757';
      } else if (strength === 2) {
        fill.style.width = '50%';
        fill.style.background = '#ffa502';
        text.textContent = 'Fair password';
        text.style.color = '#ffa502';
      } else if (strength === 3) {
        fill.style.width = '75%';
        fill.style.background = '#1e90ff';
        text.textContent = 'Good password';
        text.style.color = '#1e90ff';
      } else {
        fill.style.width = '100%';
        fill.style.background = '#2ed573';
        text.textContent = 'Strong password';
        text.style.color = '#2ed573';
      }
    });

    // Helper functions
    function showMessage(elementId, message, type) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.className = `message ${type}`;
      el.style.display = 'block';
    }

    function clearMessages() {
      document.querySelectorAll('.message').forEach(m => m.style.display = 'none');
    }

    function setLoading(button, loading) {
      if (loading) {
        button.classList.add('loading');
        button.disabled = true;
      } else {
        button.classList.remove('loading');
        button.disabled = false;
      }
    }

    // Login submit
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = loginForm.querySelector('button');
      setLoading(btn, true);
      clearMessages();

      const data = {
        username: loginForm.username.value.trim(),
        password: loginForm.password.value
      };

      try {
        const res = await fetch('/login/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const response = await res.json();

        if (response.status === 'success') {
          showMessage('login-message', response.message, 'success');
          setTimeout(() => {
            window.location.href = response.redirect;
          }, 1000);
        } else {
          showMessage('login-message', response.message, 'error');
        }
      } catch (err) {
        showMessage('login-message', 'Connection error. Please try again.', 'error');
        console.error(err);
      } finally {
        setLoading(btn, false);
      }
    });

    // Signup submit
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = signupForm.querySelector('button');
      setLoading(btn, true);
      clearMessages();

      if (signupForm.password.value !== signupForm.confirm_password.value) {
        showMessage('signup-message', 'Passwords do not match!', 'error');
        setLoading(btn, false);
        return;
      }

      const data = {
        username: signupForm.username.value.trim(),
        email: signupForm.email.value.trim(),
        password: signupForm.password.value,
        confirm_password: signupForm.confirm_password.value
      };

      try {
        const res = await fetch('/signup/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const response = await res.json();

        if (response.status === 'success') {
          showMessage('signup-message', response.message, 'success');
          signupForm.reset();
          passwordStrength.style.display = 'none';
        } else {
          showMessage('signup-message', response.message, 'error');
        }
      } catch (err) {
        showMessage('signup-message', 'Connection error. Please try again.', 'error');
        console.error(err);
      } finally {
        setLoading(btn, false);
      }
    });

    // Forgot password submit
    forgotForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = forgotForm.querySelector('button');
      setLoading(btn, true);
      clearMessages();

      const data = { email: forgotForm.email.value.trim() };

      try {
        const res = await fetch('/forgot-password/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const response = await res.json();

        if (response.status === 'success') {
          showMessage('forgot-message', response.message, 'success');
          forgotForm.reset();
        } else {
          showMessage('forgot-message', response.message, 'error');
        }
      } catch (err) {
        showMessage('forgot-message', 'Connection error. Please try again.', 'error');
        console.error(err);
      } finally {
        setLoading(btn, false);
      }
    });
  </script>
</body>
</html>
